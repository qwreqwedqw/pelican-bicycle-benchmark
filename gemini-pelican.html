<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 - SVG 2D 动画</title>
  <style>
    :root {
      --bg-page: #1a2634;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --text-color: #2b3a4a;
      --accent: #e76f51;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .stage-container {
      width: 100%;
      max-width: 960px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
      border: 4px solid rgba(255, 255, 255, 0.15);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      font-size: 14px;
      color: var(--text-color);
      font-weight: 600;
      white-space: nowrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 110px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 10px rgba(231, 111, 81, 0.35);
    }

    button:hover {
      background: #d65a3b;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #2a9d8f;
      box-shadow: 0 3px 10px rgba(42, 157, 143, 0.35);
    }

    button.secondary:hover {
      background: #21867a;
    }

    @media (max-width: 640px) {
      .controls {
        bottom: 10px;
        padding: 8px 14px;
        gap: 10px;
        font-size: 12px;
      }
      input[type="range"] {
        width: 75px;
      }
      button {
        padding: 5px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="stage-container">
    <svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 白天与黄昏天空渐变 -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="skyTop" offset="0%" stop-color="#6ec6ff" />
          <stop id="skyMid" offset="60%" stop-color="#bce6ff" />
          <stop id="skyBot" offset="100%" stop-color="#fff5e4" />
        </linearGradient>

        <!-- 海洋渐变 -->
        <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="seaTop" offset="0%" stop-color="#219ebc" />
          <stop id="seaBot" offset="100%" stop-color="#126782" />
        </linearGradient>

        <!-- 鹈鹕大喉囊渐变 -->
        <linearGradient id="pouchGrad" x1="15%" y1="0%" x2="75%" y2="100%">
          <stop offset="0%" stop-color="#ffb703" />
          <stop offset="45%" stop-color="#fb8500" />
          <stop offset="100%" stop-color="#e76f51" />
        </linearGradient>

        <!-- 上喙渐变 -->
        <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffd166" />
          <stop offset="70%" stop-color="#f4a261" />
          <stop offset="100%" stop-color="#e76f51" />
        </linearGradient>

        <!-- 鹈鹕身体立体柔光 -->
        <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8f9fa" />
          <stop offset="100%" stop-color="#dce4ec" />
        </linearGradient>

        <!-- 自行车复古青绿金属漆 -->
        <linearGradient id="bikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#48cae4" />
          <stop offset="50%" stop-color="#2a9d8f" />
          <stop offset="100%" stop-color="#1d6f65" />
        </linearGradient>

        <!-- 公路表面 -->
        <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5c677d" />
          <stop offset="100%" stop-color="#33415c" />
        </linearGradient>

        <!-- 柔和投影滤镜 -->
        <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18" />
        </filter>
      </defs>

      <!-- ================= 1. 背景层 ================= -->
      <rect width="900" height="440" fill="url(#skyGrad)" />

      <!-- 太阳 -->
      <g id="sunGroup" transform="translate(750, 110)">
        <circle r="58" fill="#ffd166" opacity="0.25" />
        <circle r="42" fill="#ffbe0b" />
      </g>

      <!-- 远景海鸥 -->
      <g id="seagulls" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
        <path id="gull1" d="M 180 95 Q 190 82 200 92 Q 210 82 220 95" />
        <path id="gull2" d="M 235 75 Q 242 66 250 73 Q 258 66 265 75" />
        <path id="gull3" d="M 620 140 Q 628 130 636 138 Q 644 130 652 140" />
      </g>

      <!-- 滚动的云朵 -->
      <g id="clouds" fill="#ffffff" opacity="0.88">
        <g class="cloud" data-x="120" data-speed="0.18" transform="translate(120, 75)">
          <path d="M 0 30 Q 5 5 30 10 Q 50 -10 75 8 Q 100 5 105 30 Z" />
        </g>
        <g class="cloud" data-x="480" data-speed="0.12" transform="translate(480, 55) scale(1.25)">
          <path d="M 0 30 Q 5 5 30 10 Q 50 -10 75 8 Q 100 5 105 30 Z" />
        </g>
        <g class="cloud" data-x="820" data-speed="0.22" transform="translate(820, 110) scale(0.85)">
          <path d="M 0 30 Q 5 5 30 10 Q 50 -10 75 8 Q 100 5 105 30 Z" />
        </g>
      </g>

      <!-- 远景海岛与灯塔 (慢速视差) -->
      <g id="distantIsland" transform="translate(680, 340)">
        <path d="M -120 20 Q -40 -35 50 -10 Q 110 5 150 20 Z" fill="#84a59d" />
        <!-- 灯塔 -->
        <polygon points="15,-8 27,-8 24,-52 18,-52" fill="#f8f9fa" />
        <polygon points="16,-25 26,-25 25,-36 17,-36" fill="#e63946" />
        <rect x="16" y="-56" width="10" height="4" rx="1" fill="#1d3557" />
        <polygon points="15,-56 27,-56 21,-64" fill="#e63946" />
      </g>

      <!-- 海洋层 -->
      <rect x="0" y="355" width="900" height="65" fill="url(#seaGrad)" />
      <g id="seaWaves" stroke="#8ecae6" stroke-width="2" stroke-linecap="round" opacity="0.55"></g>

      <!-- 海滨长廊围栏与灌木 -->
      <rect x="0" y="408" width="900" height="24" fill="#e9c46a" />
      <rect x="0" y="404" width="900" height="6" fill="#f4a261" />
      <g id="boardwalkPosts"></g>

      <!-- 公路层 -->
      <rect x="0" y="430" width="900" height="170" fill="url(#roadGrad)" />
      <!-- 路肩线 -->
      <line x1="0" y1="436" x2="900" y2="436" stroke="#e0e1dd" stroke-width="3" opacity="0.6" />
      <!-- 滚动的马路虚线 -->
      <g id="roadLines"></g>
      <!-- 滚动的路边小石子 -->
      <g id="roadPebbles" fill="#222b3d" opacity="0.5"></g>

      <!-- ================= 2. 自行车与鹈鹕主体 ================= -->
      <!-- 地面车影 -->
      <g id="groundShadows" fill="#1b2230" opacity="0.32">
        <ellipse id="shadowRear" cx="270" cy="516" rx="75" ry="10" />
        <ellipse id="shadowMid" cx="415" cy="518" rx="95" ry="13" />
        <ellipse id="shadowFront" cx="570" cy="516" rx="75" ry="10" />
      </g>

      <!-- 速度风线 -->
      <g id="windLines" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0">
        <line id="wind1" x1="120" y1="190" x2="60" y2="190" />
        <line id="wind2" x1="160" y1="280" x2="80" y2="280" />
        <line id="wind3" x1="110" y1="380" x2="45" y2="380" />
      </g>

      <!-- 整体骑行组 -->
      <g id="riderScene">

        <!-- 2.1 左后侧翅膀（握左车把） -->
        <g id="backWingGroup">
          <path id="backWingPath" d="" fill="#dbe2ea" stroke="#b8c4d0" stroke-width="3" stroke-linejoin="round" />
        </g>

        <!-- 2.2 左腿（后方腿）与后脚踏 -->
        <g id="backLegGroup">
          <!-- 后曲柄 -->
          <line id="backCrank" x1="400" y1="430" x2="400" y2="466" stroke="#7f8c8d" stroke-width="7" stroke-linecap="round" />
          <!-- 左小腿（深橙色） -->
          <line id="backCalf" x1="340" y1="350" x2="400" y2="455" stroke="#d95d39" stroke-width="11" stroke-linecap="round" />
          <!-- 左大腿羽毛 -->
          <line id="backThigh" x1="340" y1="290" x2="340" y2="350" stroke="#dce4ec" stroke-width="24" stroke-linecap="round" />
          <!-- 左脚掌（大蹼足） -->
          <path id="backFoot" d="" fill="#d95d39" stroke="#b84627" stroke-width="2" stroke-linejoin="round" />
          <!-- 后脚踏板 -->
          <rect id="backPedal" x="-16" y="-5" width="32" height="10" rx="4" fill="#2b2d42" stroke="#8d99ae" stroke-width="2" />
        </g>

        <!-- 2.3 自行车车轮（不随车架弹簧起伏，紧贴路面） -->
        <!-- 后轮 (270, 430) -->
        <g id="rearWheel" transform="translate(270, 430)">
          <!-- 外胎 -->
          <circle r="76" fill="none" stroke="#2b2d42" stroke-width="14" />
          <!-- 复古白边胎壁 -->
          <circle r="67" fill="none" stroke="#f8f9fa" stroke-width="4" />
          <!-- 轮圈 -->
          <circle r="63" fill="none" stroke="#adb5bd" stroke-width="3" />
          <!-- 辐条组 -->
          <g id="rearSpokes" stroke="#ced4da" stroke-width="2">
            <line x1="-62" y1="0" x2="62" y2="0" />
            <line x1="0" y1="-62" x2="0" y2="62" />
            <line x1="-44" y1="-44" x2="44" y2="44" />
            <line x1="-44" y1="44" x2="44" y2="-44" />
            <line x1="-57" y1="-24" x2="57" y2="24" />
            <line x1="-24" y1="-57" x2="24" y2="57" />
            <line x1="-57" y1="24" x2="57" y2="-24" />
            <line x1="-24" y1="57" x2="24" y2="-57" />
            <!-- 气嘴与反光片 -->
            <rect x="36" y="-5" width="12" height="6" rx="3" fill="#ffb703" stroke="none" />
          </g>
          <!-- 后飞轮 -->
          <circle r="13" fill="#495057" stroke="#adb5bd" stroke-width="3" />
        </g>

        <!-- 前轮 (570, 430) -->
        <g id="frontWheel" transform="translate(570, 430)">
          <circle r="76" fill="none" stroke="#2b2d42" stroke-width="14" />
          <circle r="67" fill="none" stroke="#f8f9fa" stroke-width="4" />
          <circle r="63" fill="none" stroke="#adb5bd" stroke-width="3" />
          <g id="frontSpokes" stroke="#ced4da" stroke-width="2">
            <line x1="-62" y1="0" x2="62" y2="0" />
            <line x1="0" y1="-62" x2="0" y2="62" />
            <line x1="-44" y1="-44" x2="44" y2="44" />
            <line x1="-44" y1="44" x2="44" y2="-44" />
            <line x1="-57" y1="-24" x2="57" y2="24" />
            <line x1="-24" y1="-57" x2="24" y2="57" />
            <line x1="-57" y1="24" x2="57" y2="-24" />
            <line x1="-24" y1="57" x2="24" y2="-57" />
            <rect x="-48" y="-5" width="12" height="6" rx="3" fill="#ffb703" stroke="none" />
          </g>
          <circle r="9" fill="#2a9d8f" stroke="#e9ecef" stroke-width="3" />
        </g>

        <!-- 2.4 自行车车架与传动组 -->
        <g id="bikeFrameGroup" filter="url(#softShadow)">
          <!-- 链条 -->
          <path id="bikeChain" d="M 270 417 L 400 403 A 27 27 0 0 1 400 457 L 270 443 A 13 13 0 0 1 270 417 Z"
                fill="none" stroke="#343a40" stroke-width="4.5" stroke-dasharray="6 4" />

          <!-- 后挡泥板 -->
          <path d="M 183 415 A 87 87 0 0 1 340 375" fill="none" stroke="#e9ecef" stroke-width="7" stroke-linecap="round" />
          <!-- 前挡泥板 -->
          <path d="M 495 385 A 87 87 0 0 1 645 385" fill="none" stroke="#e9ecef" stroke-width="7" stroke-linecap="round" />

          <!-- 车架管材 -->
          <g stroke="url(#bikeGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- 后下叉 -->
            <line x1="270" y1="430" x2="400" y2="430" />
            <!-- 后上叉 -->
            <line x1="270" y1="430" x2="345" y2="322" />
            <!-- 立管 -->
            <line x1="400" y1="430" x2="338" y2="305" />
            <!-- 下管 -->
            <path d="M 400 430 Q 465 390 520 325" />
            <!-- 复古弧形上管 -->
            <path d="M 345 322 Q 435 340 515 308" />
            <!-- 前叉 -->
            <path d="M 512 298 L 522 330 Q 545 395 570 430" />
          </g>

          <!-- 车把立管与复古燕把 -->
          <path d="M 512 298 L 502 252 Q 498 240 482 248 L 465 256" fill="none" stroke="#ced4da" stroke-width="8" stroke-linecap="round" />
          <!-- 车铃铛 -->
          <g id="bikeBell" transform="translate(492, 236)" style="cursor: pointer;">
            <path d="M -8 6 A 8 8 0 0 1 8 6 Z" fill="#ffb703" stroke="#d48b00" stroke-width="1.5" />
            <rect x="-3" y="6" width="6" height="4" fill="#6c757d" />
          </g>
          <!-- 复古车头灯 -->
          <g transform="translate(532, 305)">
            <path d="M -8 -8 L 6 -11 L 6 11 L -8 8 Z" fill="#ced4da" />
            <ellipse cx="6" cy="0" rx="3" ry="11" fill="#fff3b0" />
            <!-- 灯光光束 (黄昏模式显现) -->
            <polygon id="headlightBeam" points="8,-8 260,-65 260,85 8,8" fill="#fff3b0" opacity="0" />
          </g>

          <!-- 座管与皮革坐垫 -->
          <line x1="338" y1="305" x2="332" y2="288" stroke="#ced4da" stroke-width="7" stroke-linecap="round" />
          <path d="M 302 286 Q 325 294 360 286 Q 368 286 364 294 Q 332 306 304 298 Z" fill="#7f4f24" stroke="#582f0e" stroke-width="2" />

          <!-- 中轴牙盘 (400, 430) -->
          <g id="chainringGroup" transform="translate(400, 430)">
            <circle r="27" fill="#e9ecef" stroke="#495057" stroke-width="4" />
            <circle r="20" fill="none" stroke="#adb5bd" stroke-width="3" stroke-dasharray="8 6" />
            <circle r="8" fill="#2a9d8f" />
          </g>
        </g>

        <!-- 2.5 鹈鹕身体、脖子、大嘴囊与头部 -->
        <g id="pelicanBodyGroup" filter="url(#softShadow)">
          <!-- 尾羽 -->
          <g id="pelicanTail">
            <path d="M 300 284 L 252 268 L 270 258 L 256 244 L 298 258 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />
          </g>

          <!-- 圆润丰满的躯干 -->
          <path d="M 418 205
                   C 452 225, 456 278, 412 300
                   C 372 318, 315 305, 292 280
                   C 282 268, 290 242, 325 225
                   C 358 208, 392 195, 418 205 Z"
                fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />

          <!-- 肚子下方柔和的羽毛层次 -->
          <path d="M 325 288 Q 375 305 420 280" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

          <!-- 脖颈 (修长优雅的S型) -->
          <path id="pelicanNeck"
                d="M 392 218 C 385 178, 398 142, 416 115 L 448 122 C 435 150, 425 182, 434 222 Z"
                fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2" />

          <!-- 飘动的红色条纹围巾 -->
          <g id="scarfGroup">
            <!-- 飘带后支 -->
            <path id="scarfTailBack" d="" fill="none" stroke="#c1121f" stroke-width="12" stroke-linecap="round" />
            <!-- 飘带主支 -->
            <path id="scarfTailFront" d="" fill="none" stroke="#e63946" stroke-width="14" stroke-linecap="round" />
            <path id="scarfTailStripe" d="" fill="none" stroke="#ffffff" stroke-width="14" stroke-dasharray="6 14" stroke-linecap="round" opacity="0.85" />
            <!-- 围巾脖圈 -->
            <path d="M 386 192 Q 412 204 438 194" fill="none" stroke="#e63946" stroke-width="15" stroke-linecap="round" />
            <path d="M 386 192 Q 412 204 438 194" fill="none" stroke="#ffffff" stroke-width="15" stroke-dasharray="5 12" stroke-linecap="round" opacity="0.85" />
          </g>

          <!-- 鹈鹕头部与大嘴组件 -->
          <g id="pelicanHeadGroup">
            <!-- 后脑勺呆毛 -->
            <path id="headCrest" d="M 412 108 L 390 102 L 404 95 L 392 85 L 418 94 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />

            <!-- 口腔深处底色 -->
            <path d="M 448 118 L 615 125 L 448 140 Z" fill="#b5179e" opacity="0.4" />

            <!-- 嘴囊里探头的小鱼 -->
            <g id="pouchFish" transform="translate(545, 132) rotate(-12)">
              <!-- 鱼身 -->
              <path d="M -28 0 Q -5 -16 22 0 Q -5 16 -28 0 Z" fill="#4cc9f0" stroke="#0077b6" stroke-width="2" />
              <!-- 鱼尾 -->
              <polygon points="-26,0 -40,-10 -36,0 -40,10" fill="#4895ef" stroke="#0077b6" stroke-width="1.5" />
              <!-- 鱼鳃与鱼眼 -->
              <path d="M 6 -6 Q 2 0 6 6" fill="none" stroke="#0077b6" stroke-width="1.5" />
              <circle cx="12" cy="-2" r="3" fill="#ffffff" />
              <circle cx="13" cy="-2" r="1.5" fill="#03045e" />
            </g>

            <!-- 标志性巨大喉囊 (Gular Pouch - 动态控制点) -->
            <path id="pelicanPouch"
                  d="M 442 126 C 460 225, 580 232, 622 126 Q 535 136 442 126 Z"
                  fill="url(#pouchGrad)" stroke="#d65a3b" stroke-width="2.5" stroke-linejoin="round" />

            <!-- 喉囊立体纹理褶皱 -->
            <path id="pouchCrease1" d="M 462 145 C 480 198, 560 202, 598 134" fill="none" stroke="#e76f51" stroke-width="2" stroke-linecap="round" opacity="0.65" />
            <path id="pouchCrease2" d="M 480 140 C 495 172, 545 175, 575 135" fill="none" stroke="#ffbe0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

            <!-- 修长的上喙 (带前端钩尖) -->
            <path id="pelicanUpperBeak"
                  d="M 446 100
                     Q 538 106 624 114
                     C 634 115, 636 127, 628 131
                     C 623 133, 620 127, 618 123
                     Q 532 132 442 126 Z"
                  fill="url(#beakTopGrad)" stroke="#d96b27" stroke-width="2" stroke-linejoin="round" />

            <!-- 头骨圆顶 -->
            <path d="M 408 118 C 406 90, 444 86, 456 104 C 460 112, 454 126, 442 128 C 428 130, 410 126, 408 118 Z"
                  fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

            <!-- 脸颊红晕 -->
            <ellipse cx="442" cy="120" rx="6" ry="3.5" fill="#ff758f" opacity="0.55" />

            <!-- 眼睛 (带黄色眼圈与眨眼眼睑) -->
            <g transform="translate(436, 108)">
              <circle r="9" fill="#ffd166" stroke="#e09f3e" stroke-width="1.5" />
              <circle r="6.5" fill="#ffffff" />
              <circle cx="2" cy="0" r="4" fill="#1d3557" />
              <circle cx="3.5" cy="-1.5" r="1.5" fill="#ffffff" />
              <ellipse id="eyelid" cx="0" cy="0" rx="7.5" ry="0" fill="#ffd166" />
            </g>

            <!-- 迷你海魂水手帽 -->
            <g transform="translate(426, 90) rotate(-14)">
              <path d="M -18 4 C -20 -10, 20 -10, 18 4 Z" fill="#ffffff" stroke="#1d3557" stroke-width="2" />
              <rect x="-19" y="1" width="38" height="6" rx="3" fill="#1d3557" />
              <circle cx="0" cy="-8" r="3" fill="#ffb703" />
              <!-- 小船锚徽章 -->
              <line x1="0" y1="-4" x2="0" y2="0" stroke="#ffb703" stroke-width="1.5" />
            </g>
          </g>
        </g>

        <!-- 2.6 右腿（前方主腿）与前脚踏 -->
        <g id="frontLegGroup">
          <!-- 前曲柄 -->
          <line id="frontCrank" x1="400" y1="430" x2="400" y2="394" stroke="#adb5bd" stroke-width="8" stroke-linecap="round" />
          <circle cx="400" cy="430" r="5" fill="#495057" />
          <!-- 右小腿（鲜亮橙色） -->
          <line id="frontCalf" x1="340" y1="350" x2="400" y2="455" stroke="#f77f00" stroke-width="12" stroke-linecap="round" />
          <!-- 右大腿羽毛（带膝盖羽毛簇） -->
          <line id="frontThigh" x1="340" y1="290" x2="340" y2="350" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
          <circle id="frontKneeTuft" cx="340" cy="350" r="13" fill="#ffffff" />
          <!-- 右脚掌（大蹼足） -->
          <path id="frontFoot" d="" fill="#f77f00" stroke="#d65a3b" stroke-width="2" stroke-linejoin="round" />
          <!-- 前脚踏板 -->
          <g id="frontPedalGroup">
            <rect x="-17" y="-5" width="34" height="10" rx="4" fill="#2b2d42" stroke="#ced4da" stroke-width="2" />
            <rect x="-9" y="-2" width="18" height="4" rx="1" fill="#ffb703" />
          </g>
        </g>

        <!-- 2.7 右前侧主翅膀（握车把 + 黑色初级飞羽尖） -->
        <g id="frontWingGroup" filter="url(#softShadow)">
          <!-- 黑色飞羽底层 -->
          <path id="frontWingTips" d="" fill="#2b2d42" stroke="#1a1c29" stroke-width="2" stroke-linejoin="round" />
          <!-- 白色主覆羽 -->
          <path id="frontWingMain" d="" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round" />
          <!-- 翅膀内部羽轴装饰线 -->
          <path id="frontWingDetail" d="" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
          <!-- 车把橡胶握把套（压在翅膀指尖下方或交叠） -->
          <rect id="frontGrip" x="462" y="250" width="24" height="10" rx="5" transform="rotate(-18 474 255)" fill="#7f4f24" stroke="#582f0e" stroke-width="1.5" />
        </g>

        <!-- 互动音符/水花气泡提示 -->
        <g id="bellNotes" opacity="0" transform="translate(500, 210)">
          <text x="0" y="0" font-size="22" fill="#ffbe0b" font-weight="bold" stroke="#1d3557" stroke-width="0.8">♪ 叮铃铃~</text>
        </g>

      </g>
    </svg>

    <!-- 底部交互控制栏 -->
    <div class="controls">
      <div class="control-group">
        <span>🚴 骑行速度</span>
        <input id="speedSlider" type="range" min="0.2" max="2.6" step="0.1" value="1.1">
      </div>
      <button id="feedBtn" type="button">🐟 颠一下小鱼 / 响铃</button>
      <button id="themeBtn" class="secondary" type="button">🌅 切换日落</button>
    </div>
  </div>

  <script>
    (() => {
      // ================== 初始化场景重复元素 ==================
      const roadLinesGroup = document.getElementById('roadLines');
      const roadPebblesGroup = document.getElementById('roadPebbles');
      const boardwalkPostsGroup = document.getElementById('boardwalkPosts');
      const seaWavesGroup = document.getElementById('seaWaves');

      // 生成马路虚线
      const roadDashes = [];
      for (let i = 0; i < 8; i++) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('y', '495');
        rect.setAttribute('width', '65');
        rect.setAttribute('height', '8');
        rect.setAttribute('rx', '4');
        rect.setAttribute('fill', '#ffd166');
        rect.setAttribute('opacity', '0.85');
        roadLinesGroup.appendChild(rect);
        roadDashes.push({ el: rect, x: i * 130 });
      }

      // 生成路面碎石装饰
      const pebbles = [];
      for (let i = 0; i < 14; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        const y = 450 + (i * 37) % 135;
        c.setAttribute('cy', y);
        c.setAttribute('rx', 3 + (i % 4));
        c.setAttribute('ry', 1.8);
        roadPebblesGroup.appendChild(c);
        pebbles.push({ el: c, x: i * 72 });
      }

      // 生成海岸护栏木桩
      const posts = [];
      for (let i = 0; i < 13; i++) {
        const post = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        post.setAttribute('y', '396');
        post.setAttribute('width', '10');
        post.setAttribute('height', '36');
        post.setAttribute('rx', '3');
        post.setAttribute('fill', '#d4a373');
        post.setAttribute('stroke', '#bc6c25');
        post.setAttribute('stroke-width', '1.5');
        boardwalkPostsGroup.appendChild(post);
        posts.push({ el: post, x: i * 80 });
      }

      // 生成海面波浪线
      const waves = [];
      for (let i = 0; i < 10; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const y = 366 + (i % 3) * 14;
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        seaWavesGroup.appendChild(line);
        waves.push({ el: line, x: i * 105, len: 30 + (i % 3) * 15 });
      }

      // ================== 获取动画 DOM 引用 ==================
      const rearSpokes = document.getElementById('rearSpokes');
      const frontSpokes = document.getElementById('frontSpokes');
      const bikeChain = document.getElementById('bikeChain');
      const chainringGroup = document.getElementById('chainringGroup');
      const bikeFrameGroup = document.getElementById('bikeFrameGroup');
      const pelicanBodyGroup = document.getElementById('pelicanBodyGroup');
      const pelicanHeadGroup = document.getElementById('pelicanHeadGroup');
      const pelicanTail = document.getElementById('pelicanTail');
      const headCrest = document.getElementById('headCrest');
      const pelicanPouch = document.getElementById('pelicanPouch');
      const pouchCrease1 = document.getElementById('pouchCrease1');
      const pouchCrease2 = document.getElementById('pouchCrease2');
      const pouchFish = document.getElementById('pouchFish');
      const eyelid = document.getElementById('eyelid');

      // 双腿元素
      const frontCrank = document.getElementById('frontCrank');
      const frontThigh = document.getElementById('frontThigh');
      const frontCalf = document.getElementById('frontCalf');
      const frontKneeTuft = document.getElementById('frontKneeTuft');
      const frontFoot = document.getElementById('frontFoot');
      const frontPedalGroup = document.getElementById('frontPedalGroup');

      const backCrank = document.getElementById('backCrank');
      const backThigh = document.getElementById('backThigh');
      const backCalf = document.getElementById('backCalf');
      const backFoot = document.getElementById('backFoot');
      const backPedal = document.getElementById('backPedal');

      // 翅膀与围巾元素
      const frontWingMain = document.getElementById('frontWingMain');
      const frontWingTips = document.getElementById('frontWingTips');
      const frontWingDetail = document.getElementById('frontWingDetail');
      const backWingPath = document.getElementById('backWingPath');
      const scarfTailFront = document.getElementById('scarfTailFront');
      const scarfTailStripe = document.getElementById('scarfTailStripe');
      const scarfTailBack = document.getElementById('scarfTailBack');

      // 环境与特效元素
      const cloudEls = document.querySelectorAll('.cloud');
      const distantIsland = document.getElementById('distantIsland');
      const windLines = document.getElementById('windLines');
      const bellNotes = document.getElementById('bellNotes');

      // ================== 逆运动学 (2-Bone IK) 求解器 ==================
      /**
       * 计算两段骨骼的关节坐标
       * @param {number} hx 起点X (髋关节/肩关节)
       * @param {number} hy 起点Y
       * @param {number} tx 终点X (脚踝/手腕)
       * @param {number} ty 终点Y
       * @param {number} L1 第一段长度
       * @param {number} L2 第二段长度
       * @param {number} bendDir 弯曲方向 (+1 或 -1)
       */
      function solveIK(hx, hy, tx, ty, L1, L2, bendDir = -1) {
        const dx = tx - hx;
        const dy = ty - hy;
        let dist = Math.hypot(dx, dy);

        // 防止超出最大伸展距离
        const maxReach = L1 + L2 - 0.01;
        if (dist > maxReach) dist = maxReach;
        if (dist < Math.abs(L1 - L2) + 0.01) dist = Math.abs(L1 - L2) + 0.01;

        const baseAngle = Math.atan2(dy, dx);
        const cosAlpha = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));
        const jointAngle = baseAngle + bendDir * alpha;

        return {
          jx: hx + L1 * Math.cos(jointAngle),
          jy: hy + L1 * Math.sin(jointAngle)
        };
      }

      /**
       * 更新单侧腿部、脚掌与脚踏板的 SVG 坐标
       */
      function updateLeg(hipX, hipY, pedalAngle, elements) {
        const crankCenterX = 400;
        const crankCenterY = 430;
        const crankRadius = 35;

        // 踏板中心位置
        const px = crankCenterX + crankRadius * Math.cos(pedalAngle);
        const py = crankCenterY + crankRadius * Math.sin(pedalAngle);

        // 脚踝位于踏板上方偏后一点，使大蹼足自然踩在踏板上
        const footTilt = Math.sin(pedalAngle) * 0.14; // 踩踏时脚尖微调角度
        const ankleX = px - 10;
        const ankleY = py - 9;

        // 解算膝盖位置 (bendDir = -1 表示膝盖向车头方向/+X方向弯曲)
        const { jx: kneeX, jy: kneeY } = solveIK(hipX, hipY, ankleX, ankleY, 92, 92, -1);

        // 更新曲柄
        elements.crank.setAttribute('x2', px.toFixed(1));
        elements.crank.setAttribute('y2', py.toFixed(1));

        // 更新大腿与小腿
        elements.thigh.setAttribute('x1', hipX.toFixed(1));
        elements.thigh.setAttribute('y1', hipY.toFixed(1));
        elements.thigh.setAttribute('x2', kneeX.toFixed(1));
        elements.thigh.setAttribute('y2', kneeY.toFixed(1));

        if (elements.kneeTuft) {
          elements.kneeTuft.setAttribute('cx', kneeX.toFixed(1));
          elements.kneeTuft.setAttribute('cy', kneeY.toFixed(1));
        }

        elements.calf.setAttribute('x1', kneeX.toFixed(1));
        elements.calf.setAttribute('y1', kneeY.toFixed(1));
        elements.calf.setAttribute('x2', ankleX.toFixed(1));
        elements.calf.setAttribute('y2', ankleY.toFixed(1));

        // 绘制鹈鹕扇形大蹼足
        const heelX = px - 15;
        const heelY = py + 1;
        const toe1X = px + 24;
        const toe1Y = py + 1 + footTilt * 14;
        const toe2X = px + 18;
        const toe2Y = py - 6 + footTilt * 10;

        const footPath = `
          M ${ankleX.toFixed(1)} ${ankleY.toFixed(1)}
          L ${heelX.toFixed(1)} ${heelY.toFixed(1)}
          L ${toe1X.toFixed(1)} ${toe1Y.toFixed(1)}
          Q ${(px + 14).toFixed(1)} ${(py - 4).toFixed(1)} ${toe2X.toFixed(1)} ${toe2Y.toFixed(1)}
          Z
        `;
        elements.foot.setAttribute('d', footPath);

        // 更新踏板位置
        if (elements.pedalGroup) {
          elements.pedalGroup.setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)})`);
        } else if (elements.pedal) {
          elements.pedal.setAttribute('x', (px - 16).toFixed(1));
          elements.pedal.setAttribute('y', (py - 5).toFixed(1));
        }
      }

      // ================== 交互状态与参数 ==================
      let speedMultiplier = 1.1;
      let crankAngle = 0;
      let wheelAngle = 0;
      let islandX = 680;
      let fishJumpBoost = 0;
      let bellTimer = 0;
      let isSunset = false;

      const speedSlider = document.getElementById('speedSlider');
      const feedBtn = document.getElementById('feedBtn');
      const themeBtn = document.getElementById('themeBtn');
      const bikeBell = document.getElementById('bikeBell');

      speedSlider.addEventListener('input', (e) => {
        speedMultiplier = parseFloat(e.target.value);
      });

      function triggerFunAction() {
        fishJumpBoost = 28;
        bellTimer = 1.2;
      }

      feedBtn.addEventListener('click', triggerFunAction);
      bikeBell.addEventListener('click', triggerFunAction);
      pelicanHeadGroup.style.cursor = 'pointer';
      pelicanHeadGroup.addEventListener('click', triggerFunAction);

      themeBtn.addEventListener('click', () => {
        isSunset = !isSunset;
        const skyTop = document.getElementById('skyTop');
        const skyMid = document.getElementById('skyMid');
        const skyBot = document.getElementById('skyBot');
        const seaTop = document.getElementById('seaTop');
        const headlightBeam = document.getElementById('headlightBeam');
        const sunGroup = document.getElementById('sunGroup');

        if (isSunset) {
          skyTop.setAttribute('stop-color', '#3d405b');
          skyMid.setAttribute('stop-color', '#e07a5f');
          skyBot.setAttribute('stop-color', '#f2cc8f');
          seaTop.setAttribute('stop-color', '#457b9d');
          headlightBeam.setAttribute('opacity', '0.28');
          sunGroup.setAttribute('transform', 'translate(750, 240)');
          themeBtn.textContent = '☀️ 切换晴天';
        } else {
          skyTop.setAttribute('stop-color', '#6ec6ff');
          skyMid.setAttribute('stop-color', '#bce6ff');
          skyBot.setAttribute('stop-color', '#fff5e4');
          seaTop.setAttribute('stop-color', '#219ebc');
          headlightBeam.setAttribute('opacity', '0');
          sunGroup.setAttribute('transform', 'translate(750, 110)');
          themeBtn.textContent = '🌅 切换日落';
        }
      });

      // ================== 主动画循环 ==================
      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        // 1. 曲柄与车轮旋转角度 (传动比约为 2.1)
        const angularVelocity = 4.2 * speedMultiplier;
        crankAngle += angularVelocity * dt;
        const wheelDelta = angularVelocity * 2.1 * dt;
        wheelAngle += wheelDelta;

        const wheelDeg = (wheelAngle * 180) / Math.PI;
        rearSpokes.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
        frontSpokes.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
        chainringGroup.setAttribute('transform', `translate(400, 430) rotate(${((crankAngle * 180) / Math.PI).toFixed(1)})`);
        bikeChain.setAttribute('stroke-dashoffset', (-crankAngle * 27).toFixed(1));

        // 2. 路面零滑动位移计算 (线速度 v = R * dTheta, 车轮外径 R = 83)
        const linearStep = 83 * wheelDelta;

        roadDashes.forEach((item) => {
          item.x -= linearStep;
          if (item.x < -80) item.x += 8 * 130;
          item.el.setAttribute('x', item.x.toFixed(1));
        });

        pebbles.forEach((item) => {
          item.x -= linearStep;
          if (item.x < -20) item.x += 14 * 72;
          item.el.setAttribute('cx', item.x.toFixed(1));
        });

        posts.forEach((item) => {
          item.x -= linearStep * 0.65;
          if (item.x < -30) item.x += 13 * 80;
          item.el.setAttribute('x', item.x.toFixed(1));
        });

        waves.forEach((item, idx) => {
          item.x -= linearStep * 0.25;
          if (item.x < -60) item.x += 10 * 105;
          const waveBob = Math.sin(now * 0.003 + idx) * 4;
          item.el.setAttribute('x1', (item.x + waveBob).toFixed(1));
          item.el.setAttribute('x2', (item.x + item.len + waveBob).toFixed(1));
        });

        cloudEls.forEach((cloud) => {
          let x = parseFloat(cloud.dataset.x);
          const spd = parseFloat(cloud.dataset.speed);
          x -= linearStep * spd * 0.35;
          if (x < -160) x = 960;
          cloud.dataset.x = x;
          const yMatch = cloud.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/);
          const scaleMatch = cloud.getAttribute('transform').match(/scale\(([^)]+)\)/);
          const yVal = yMatch ? yMatch[1] : '75';
          const scaleStr = scaleMatch ? ` scale(${scaleMatch[1]})` : '';
          cloud.setAttribute('transform', `translate(${x.toFixed(1)}, ${yVal})${scaleStr}`);
        });

        islandX -= linearStep * 0.06;
        if (islandX < -200) islandX = 1080;
        distantIsland.setAttribute('transform', `translate(${islandX.toFixed(1)}, 340)`);

        // 3. 身体颠簸与次级物理动画 (每踩半圈身体起伏一次，即 2 * crankAngle)
        const bouncePhase = crankAngle * 2;
        const bodyBobY = Math.sin(bouncePhase) * 5.5;
        const bodyPitch = Math.cos(bouncePhase) * 1.6;
        const frameBounceY = Math.sin(bouncePhase - 0.3) * 1.8;

        bikeFrameGroup.setAttribute('transform', `translate(0, ${frameBounceY.toFixed(2)})`);
        pelicanBodyGroup.setAttribute(
          'transform',
          `translate(0, ${bodyBobY.toFixed(2)}) rotate(${bodyPitch.toFixed(2)} 365 265)`
        );

        // 头部与呆毛、尾羽的延迟摆动 (Overlapping Action)
        const headNod = Math.sin(bouncePhase - 0.65) * 2.5;
        pelicanHeadGroup.setAttribute('transform', `rotate(${headNod.toFixed(2)} 430 120)`);
        pelicanTail.setAttribute('transform', `rotate(${(Math.sin(bouncePhase - 0.9) * 5).toFixed(2)} 298 272)`);
        headCrest.setAttribute('transform', `rotate(${(Math.cos(bouncePhase - 0.8) * 6).toFixed(2)} 415 102)`);

        // 4. 巨大喉囊 (Gular Pouch) 的弹性果冻晃动与小鱼弹跳
        if (fishJumpBoost > 0.1) {
          fishJumpBoost *= Math.pow(0.06, dt);
        } else {
          fishJumpBoost = 0;
        }

        const pouchStretch = Math.sin(bouncePhase - 1.1) * 12 + Math.min(fishJumpBoost * 0.4, 8);
        const pY1 = 225 + pouchStretch;
        const pY2 = 232 + pouchStretch * 1.15;
        pelicanPouch.setAttribute(
          'd',
          `M 442 126 C 460 ${pY1.toFixed(1)}, 580 ${pY2.toFixed(1)}, 622 126 Q 535 136 442 126 Z`
        );
        pouchCrease1.setAttribute(
          'd',
          `M 462 145 C 480 ${(198 + pouchStretch * 0.75).toFixed(1)}, 560 ${(202 + pouchStretch * 0.85).toFixed(1)}, 598 134`
        );
        pouchCrease2.setAttribute(
          'd',
          `M 480 140 C 495 ${(172 + pouchStretch * 0.5).toFixed(1)}, 545 ${(175 + pouchStretch * 0.55).toFixed(1)}, 575 135`
        );

        // 小鱼在喉囊里的律动与弹跳
        const fishY = 132 + pouchStretch * 0.35 - fishJumpBoost * 1.3;
        const fishRot = -12 + Math.cos(bouncePhase - 0.8) * 8 - fishJumpBoost * 0.9;
        pouchFish.setAttribute('transform', `translate(545, ${fishY.toFixed(1)}) rotate(${fishRot.toFixed(1)})`);

        // 5. 逆运动学解算双腿踩踏
        const hipX = 342;
        const hipY = 288 + bodyBobY;

        // 右腿 (前腿, 相位 0)
        updateLeg(hipX, hipY, crankAngle, {
          crank: frontCrank,
          thigh: frontThigh,
          calf: frontCalf,
          kneeTuft: frontKneeTuft,
          foot: frontFoot,
          pedalGroup: frontPedalGroup
        });

        // 左腿 (后腿, 相位 +PI)
        updateLeg(hipX - 4, hipY - 2, crankAngle + Math.PI, {
          crank: backCrank,
          thigh: backThigh,
          calf: backCalf,
          foot: backFoot,
          pedal: backPedal
        });

        // 6. 逆运动学解算翅膀握车把 (肩膀随身体起伏，翼尖稳稳抓在车把上)
        const shoulderX = 398;
        const shoulderY = 236 + bodyBobY;
        const gripX = 474;
        const gripY = 255 + frameBounceY;

        const { jx: elbowX, jy: elbowY } = solveIK(shoulderX, shoulderY, gripX, gripY, 56, 86, 1);

        // 主翅膀白色覆羽路径
        frontWingMain.setAttribute(
          'd',
          `M ${shoulderX.toFixed(1)} ${(shoulderY - 14).toFixed(1)}
           C ${(shoulderX - 28).toFixed(1)} ${(shoulderY + 12).toFixed(1)}, ${(elbowX - 24).toFixed(1)} ${(elbowY + 6).toFixed(1)}, ${elbowX.toFixed(1)} ${(elbowY + 12).toFixed(1)}
           Q ${(elbowX + 42).toFixed(1)} ${(elbowY + 8).toFixed(1)} ${(gripX + 8).toFixed(1)} ${(gripY + 4).toFixed(1)}
           Q ${(gripX + 12).toFixed(1)} ${(gripY - 10).toFixed(1)} ${(gripX - 6).toFixed(1)} ${(gripY - 8).toFixed(1)}
           Q ${(elbowX + 22).toFixed(1)} ${(elbowY - 10).toFixed(1)} ${(shoulderX + 14).toFixed(1)} ${(shoulderY - 6).toFixed(1)}
           Z`
        );

        // 鹈鹕特征性的黑色初级飞羽下缘
        frontWingTips.setAttribute(
          'd',
          `M ${(elbowX - 10).toFixed(1)} ${(elbowY + 8).toFixed(1)}
           Q ${(elbowX + 18).toFixed(1)} ${(elbowY + 26).toFixed(1)} ${(gripX + 4).toFixed(1)} ${(gripY + 8).toFixed(1)}
           L ${(gripX - 8).toFixed(1)} ${(gripY - 4).toFixed(1)}
           Z`
        );

        frontWingDetail.setAttribute(
          'd',
          `M ${(shoulderX - 4).toFixed(1)} ${(shoulderY + 6).toFixed(1)}
           Q ${(elbowX + 6).toFixed(1)} ${(elbowY + 2).toFixed(1)} ${(gripX - 10).toFixed(1)} ${(gripY - 2).toFixed(1)}`
        );

        // 后侧左翅膀
        backWingPath.setAttribute(
          'd',
          `M ${(shoulderX + 12).toFixed(1)} ${(shoulderY - 8).toFixed(1)}
           Q ${(elbowX + 18).toFixed(1)} ${(elbowY - 6).toFixed(1)} 468 ${(248 + frameBounceY).toFixed(1)}
           L 462 ${(258 + frameBounceY).toFixed(1)}
           Q ${(elbowX + 8).toFixed(1)} ${(elbowY + 12).toFixed(1)} ${(shoulderX + 4).toFixed(1)} ${(shoulderY + 10).toFixed(1)}
           Z`
        );

        // 7. 围巾随风飘动
        const waveT = now * 0.008 * Math.max(0.6, speedMultiplier);
        const w1 = Math.sin(waveT) * 10;
        const w2 = Math.cos(waveT - 1.2) * 14;
        const scarfD = `M 392 194 C 355 ${(190 + w1).toFixed(1)}, 325 ${(208 - w1).toFixed(1)}, 290 ${(196 + w2).toFixed(1)}`;
        scarfTailFront.setAttribute('d', scarfD);
        scarfTailStripe.setAttribute('d', scarfD);
        scarfTailBack.setAttribute(
          'd',
          `M 392 196 C 362 ${(206 - w1).toFixed(1)}, 335 ${(192 + w1).toFixed(1)}, 306 ${(212 - w2).toFixed(1)}`
        );

        // 8. 速度风线与响铃特效
        if (speedMultiplier > 1.6) {
          windLines.setAttribute('opacity', ((speedMultiplier - 1.6) * 0.7).toFixed(2));
          const offset = (now * 0.8) % 60;
          windLines.setAttribute('transform', `translate(${-offset.toFixed(1)}, 0)`);
        } else {
          windLines.setAttribute('opacity', '0');
        }

        if (bellTimer > 0) {
          bellTimer -= dt;
          bellNotes.setAttribute('opacity', Math.min(1, bellTimer * 2).toFixed(2));
          bellNotes.setAttribute('transform', `translate(495, ${(215 - (1.2 - bellTimer) * 28).toFixed(1)})`);
        } else {
          bellNotes.setAttribute('opacity', '0');
        }

        // 9. 自然眨眼 (每 3.8 秒眨眼一次)
        const blinkCycle = now % 3800;
        if (blinkCycle < 140) {
          const progress = Math.sin((blinkCycle / 140) * Math.PI);
          eyelid.setAttribute('ry', (7.5 * progress).toFixed(1));
        } else {
          eyelid.setAttribute('ry', '0');
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
